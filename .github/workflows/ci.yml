name: Enterprise Multi-Agent AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint source code with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning exit for general code complexity
          flake8 app --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  test-suite:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install platform dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm || true

      - name: Verify ML Model Training & Artifacts
        run: |
          python scripts/train_ml_model.py
          test -f models/compatibility_model.joblib
          test -f models/model_metadata.json

      - name: Execute Full Pytest Test Suite
        env:
          MOCK_EXTERNAL_APIS: "true"
          ENVIRONMENT: "test"
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 | tee pytest_output.log || {
            echo "### Pytest Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  docker-build:
    name: Container Build & Health Probe Verification
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: enterprise-multi-agent-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
